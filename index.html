<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="./image/rock.png" alt="./image/rock.png">
        </div>
        <div class="choice" id="paper">
            <img src="./image/paper.png" alt="./image/paper.png">
        </div>
        <div class="choice" id="scissors">
            <img src="./image/scissors.png" alt="./image/scissors.png">
        </div>
    </div>

    <div class="score-borad">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>bot</p>
        </div>
    </div>

    <div class="msg-container">
        <div id="msg">play your move </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
